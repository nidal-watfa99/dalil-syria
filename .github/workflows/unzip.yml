name: Unzip source

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip into repository root and delete it
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No zip file found in repository root"
            exit 1
          fi
          echo "Extracting: $ZIP"
          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"

          PKG=$(find "$RUNNER_TEMP/src" -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$PKG" ]; then
            echo "package.json not found inside the zip"
            exit 1
          fi
          SRC=$(dirname "$PKG")

          rm -rf "$SRC/node_modules"
          cp -a "$SRC"/. .
          git rm -q --cached "$ZIP" || true
          rm -f "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract source from zip" || echo "Nothing to commit"
          git push

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
