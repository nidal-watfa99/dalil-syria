    <style>
      html, body { background: #131314; }
      #boot-splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #e3e3e3; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; }
      #boot-splash .bs-spin { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.15); border-top-color: #1a73e8; border-radius: 50%; animation: bs-rot 0.9s linear infinite; margin-bottom: 16px; }
      #boot-splash .bs-title { font-size: 18px; font-weight: 700; }
      #boot-help { display: none; max-width: 420px; margin-top: 22px; padding: 14px 16px; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; background: #1e1f20; font-size: 14px; line-height: 1.9; text-align: right; }
      #boot-help button { margin-top: 10px; padding: 9px 16px; border: 0; border-radius: 10px; background: #1a73e8; color: #fff; font-size: 14px; font-weight: 700; }
      #boot-err { margin-top: 8px; font-size: 12px; color: #fca5a5; direction: ltr; word-break: break-word; }
      @keyframes bs-rot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-[#131314] text-[#e3e3e3] font-['IBM_Plex_Sans_Arabic',sans-serif] antialiased selection:bg-blue-500/30 selection:text-blue-200 min-h-screen overflow-x-hidden">
    <div id="root">
      <div id="boot-splash">
        <div class="bs-spin"></div>
        <div class="bs-title">دليل سوريا — جارٍ التحميل…</div>
        <div id="boot-help">
          إذا بقيت هذه الشاشة أكثر من ثوانٍ فالتطبيق لم يُحمَّل. الأسباب الشائعة:<br />
          ١) إعداد GitHub Pages ما زال على «Deploy from a branch» بدل «GitHub Actions».<br />
          ٢) نسخة قديمة محفوظة في المتصفح — اضغط الزر أدناه.<br />
          ٣) الرابط ناقص: يجب أن ينتهي باسم المستودع <span dir="ltr">/dalil-syria/</span><br />
          <button type="button" onclick="window.dalilResetCache()">مسح الذاكرة المؤقتة وإعادة التحميل</button>
          <div id="boot-err"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        window.addEventListener('error', function (e) {
          var el = document.getElementById('boot-err');
          if (el && e && e.message) { el.textContent = String(e.message).slice(0, 200); }
        });
        setTimeout(function () {
          if (document.getElementById('boot-splash')) {
            var h = document.getElementById('boot-help');
            if (h) { h.style.display = 'block'; }
          }
        }, 7000);
        window.dalilResetCache = function () {
          var done = function () { location.reload(); };
          try {
            var jobs = [];
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && window.caches.keys) {
              jobs.push(window.caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return window.caches.delete(k); }));
              }));
            }
            Promise.all(jobs).then(done, done);
          } catch (e) { done(); }
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
