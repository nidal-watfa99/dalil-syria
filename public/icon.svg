<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05101f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="256" cy="230" r="190" fill="url(#glow)" />

  <!-- Outer Star Geometric Crest -->
  <g transform="translate(256, 224) scale(0.92)">
    <!-- Octagram / Star of Syria decorative ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6" />
    <circle cx="0" cy="0" r="144" fill="#0d1527" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

    <!-- Stylized Syrian Eagle / Government Emblem Shield -->
    <path d="M 0 -105 L 45 -45 L 85 -55 L 75 0 L 95 30 L 45 35 L 0 85 L -45 35 L -95 30 L -75 0 L -85 -55 L -45 -45 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.4" />
    
    <!-- Central Shield -->
    <path d="M -44 -40 Q 0 -50 44 -40 Q 48 30 0 76 Q -48 30 -44 -40 Z" fill="#111c33" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#softGlow)" />
    
    <!-- Shield Interior Stripes (Syrian Flag Motif - Red, White, Black with Green Stars) -->
    <!-- Top section -->
    <path d="M -40 -36 Q 0 -45 40 -36 L 42 -10 Q 0 -15 -42 -10 Z" fill="#dc2626" opacity="0.85" />
    <!-- Middle section (white) -->
    <path d="M -42 -10 Q 0 -15 42 -10 L 44 20 Q 0 16 -44 20 Z" fill="#f8fafc" />
    <!-- Lower section (black/charcoal) -->
    <path d="M -44 20 Q 0 16 44 20 Q 36 50 0 72 Q -36 50 -44 20 Z" fill="#0f172a" />

    <!-- Two Green Stars inside white stripe -->
    <g transform="translate(-16, 5) scale(0.65)">
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#emeraldGrad)" />
    </g>
    <g transform="translate(16, 5) scale(0.65)">
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#emeraldGrad)" />
    </g>

    <!-- Olive Branches / Laurels -->
    <path d="M -70 40 Q -85 -10 -55 -60" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 70 40 Q 85 -10 55 -60" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: DALIL SYRIA / دليل سوريا 2026 -->
  <text x="256" y="420" font-family="'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#f8fafc" letter-spacing="1">
    دليل سوريا
  </text>
  <text x="256" y="450" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="url(#accentGrad)" letter-spacing="4">
    DALIL SYRIA · 2026
  </text>
</svg>
